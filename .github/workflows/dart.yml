name: Dart CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        working-directory: ./todo_cli
        run: dart pub get

      - name: Analyze project
        working-directory: ./todo_cli
        run: dart analyze

      - name: Run tests
        working-directory: ./todo_cli
        run: dart test
